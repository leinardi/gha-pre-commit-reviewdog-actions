name: "Validate commit messages via conventional-pre-commit"
description: "Checks every non-merge commit in a PR diff range against the Conventional Commits spec"
author: "leinardi"
branding:
  icon: "git-commit"
  color: "blue"

inputs:
  from-ref:
    description: "Base git ref (e.g., PR base SHA)"
    required: true
  to-ref:
    description: "Head git ref (e.g., PR head SHA)"
    required: true

  python-version:
    description: >-
      The Python for setup-python, such as `3.x` or `3.13`. Its resolved version is part of the
      cache key, so keep it equal to the pre-commit warm-up's `python_version`.
    required: false
    default: "3.x"
  pre-commit-version:
    description: >-
      The pre-commit release to install, X.Y.Z. Keep it equal to the version the warm-up and the
      rest of CI install.
    required: false
    default: "4.6.2"
  cache-key-prefix:
    description: >-
      The first part of the pre-commit cache key, before `|<runner.os>|`. Keep it equal to the
      warm-up's `cache_key_prefix`.
    required: false
    default: "pre-commit"

outputs:
  exitcode:
    description: "Exit code of the conventional-pre-commit validation (0 = all commits pass)"
    value: ${{ steps.validate_commits.outputs.exitcode }}

runs:
  using: "composite"
  steps:
    # The hook environments are virtualenvs bound to the interpreter that built them, so the
    # Python is set up here and its resolved version is part of the cache key, as in
    # gh-reusable-workflows' pre-commit-warmup.yaml.
    - name: Set up Python
      id: python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install pre-commit
      shell: bash
      env:
        PRE_COMMIT_VERSION: ${{ inputs.pre-commit-version }}
      run: |
        set -euo pipefail
        # A pinned release only: the value becomes a pip requirement, so anything but X.Y.Z (an
        # empty value, a range, an option) is refused rather than handed to pip.
        if ! [[ "$PRE_COMMIT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          echo "::error title=Invalid pre-commit-version::pre-commit-version must be X.Y.Z, got '$PRE_COMMIT_VERSION'."
          exit 1
        fi
        python -m pip install --disable-pip-version-check --no-cache-dir "pre-commit==$PRE_COMMIT_VERSION"
        pre-commit --version

    # Restore only: the default branch's pre-commit warm-up is the only writer, so a pull request
    # never saves an entry. The restore key falls back to the newest entry for the same OS and
    # Python when .pre-commit-config.yaml changed; pre-commit installs only what is missing.
    - name: Restore the pre-commit cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pre-commit
        key: ${{ inputs.cache-key-prefix }}|${{ runner.os }}|${{ steps.python.outputs.python-version }}|${{ hashFiles('.pre-commit-config.yaml') }}
        restore-keys: |
          ${{ inputs.cache-key-prefix }}|${{ runner.os }}|${{ steps.python.outputs.python-version }}|

    - name: Validate commit messages
      id: validate_commits
      shell: bash
      env:
        FROM_REF: ${{ inputs.from-ref }}
        TO_REF: ${{ inputs.to-ref }}
      run: |
        set -uo pipefail
        # The hook this action runs is the caller's own, so a caller without it
        # would fail every commit with a misleading message. Say what is missing.
        if ! grep -Eq '^[[:space:]]*-?[[:space:]]*id:[[:space:]]*conventional-pre-commit([[:space:]]|$)' .pre-commit-config.yaml 2>/dev/null; then
          echo "::error::.pre-commit-config.yaml has no conventional-pre-commit hook. Add it with stages: [commit-msg] (see the README of this action)."
          echo "exitcode=1" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        if [ -z "$FROM_REF" ] || [ -z "$TO_REF" ]; then
          echo "::error::from-ref and to-ref are both required (got '$FROM_REF'..'$TO_REF'). Outside pull_request events, pass e.g. origin/main and HEAD."
          echo "exitcode=1" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        if ! COMMITS=$(git log --format='%H %P' "$FROM_REF..$TO_REF" 2>&1); then
          echo "::error::Failed to get commit log for range '$FROM_REF..$TO_REF'. Ensure 'fetch-depth: 0' is used on actions/checkout. $COMMITS"
          echo "exitcode=1" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        failed=0
        checked=0
        while read -r sha parents; do
          [ -n "$sha" ] || continue
          # Skip merge commits (more than one parent SHA)
          [ "$(echo "$parents" | wc -w)" -gt 1 ] && continue
          checked=$((checked + 1))
          msg_file="$(mktemp)"
          git log -1 --format=%B "$sha" > "$msg_file"
          if ! pre-commit run conventional-pre-commit \
                 --hook-stage commit-msg \
                 --commit-msg-filename "$msg_file" \
                 --color=never 2>&1; then
            short_sha="$(git log -1 --format=%h "$sha")"
            subject="$(git log -1 --format=%s "$sha")"
            echo "::error::Commit $short_sha has a non-conventional message: $subject"
            failed=1
          fi
          rm -f "$msg_file"
        done <<< "$COMMITS"
        echo "Checked $checked non-merge commit(s) in $FROM_REF..$TO_REF."
        echo "exitcode=$failed" >> "$GITHUB_OUTPUT"
        exit "$failed"
