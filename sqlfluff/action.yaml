name: "Run sqlfluff lint/fix via pre-commit + reviewdog"
description: "Runs sqlfluff lint (JSON) on a diff range, optionally runs sqlfluff-fix, and reports via reviewdog"
author: "leinardi"
branding:
  icon: "check-circle"
  color: "blue"

inputs:
  from-ref:
    description: "Base git ref (e.g., PR base SHA)"
    required: true
  to-ref:
    description: "Head git ref (e.g., PR head SHA)"
    required: true
  github-token:
    description: "GitHub token for reviewdog (usually secrets.GITHUB_TOKEN)"
    required: true
  run_fix:
    description: "Whether to also run sqlfluff-fix and comment the diff (true/false)"
    required: false
    default: "true"

  python-version:
    description: >-
      The Python for setup-python, such as `3.x` or `3.13`. Its resolved version is part of the
      cache key, so keep it equal to the pre-commit warm-up's `python_version`.
    required: false
    default: "3.x"
  pre-commit-version:
    description: >-
      The pre-commit release to install, X.Y.Z. Keep it equal to the version the warm-up and the
      rest of CI install.
    required: false
    default: "4.6.2"
  cache-key-prefix:
    description: >-
      The first part of the pre-commit cache key, before `|<runner.os>|`. Keep it equal to the
      warm-up's `cache_key_prefix`.
    required: false
    default: "pre-commit"

outputs:
  lint_exitcode:
    description: "Exit code from sqlfluff-lint-json-output"
    value: ${{ steps.lint.outputs.lint_exitcode }}
  fix_exitcode:
    description: "Exit code from sqlfluff-fix (if run)"
    value: ${{ steps.fix.outputs.fix_exitcode }}

runs:
  using: "composite"
  steps:
    - name: Install jq
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y jq

    # The hook environments are virtualenvs bound to the interpreter that built them, so the
    # Python is set up here and its resolved version is part of the cache key, as in
    # gh-reusable-workflows' pre-commit-warmup.yaml.
    - name: Set up Python
      id: python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install pre-commit
      shell: bash
      env:
        PRE_COMMIT_VERSION: ${{ inputs.pre-commit-version }}
      run: |
        set -euo pipefail
        # A pinned release only: the value becomes a pip requirement, so anything but X.Y.Z (an
        # empty value, a range, an option) is refused rather than handed to pip.
        if ! [[ "$PRE_COMMIT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          echo "::error title=Invalid pre-commit-version::pre-commit-version must be X.Y.Z, got '$PRE_COMMIT_VERSION'."
          exit 1
        fi
        python -m pip install --disable-pip-version-check --no-cache-dir "pre-commit==$PRE_COMMIT_VERSION"
        pre-commit --version

    # Restore only: the default branch's pre-commit warm-up is the only writer, so a pull request
    # never saves an entry. The restore key falls back to the newest entry for the same OS and
    # Python when .pre-commit-config.yaml changed; pre-commit installs only what is missing.
    - name: Restore the pre-commit cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pre-commit
        key: ${{ inputs.cache-key-prefix }}|${{ runner.os }}|${{ steps.python.outputs.python-version }}|${{ hashFiles('.pre-commit-config.yaml') }}
        restore-keys: |
          ${{ inputs.cache-key-prefix }}|${{ runner.os }}|${{ steps.python.outputs.python-version }}|

    - name: Setup reviewdog binary
      uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
      with:
        reviewdog_version: v0.21.2 # pinned by hand: Dependabot does not track this input

    - name: Run sqlfluff lint (JSON)
      id: lint
      shell: bash
      env:
        FROM_REF: ${{ inputs.from-ref }}
        TO_REF: ${{ inputs.to-ref }}
      run: |
        set +e
        set -o pipefail

        pre-commit run sqlfluff-lint-json-output \
          --hook-stage manual \
          --from-ref "$FROM_REF" \
          --to-ref   "$TO_REF" \
          --color=never \
          | tee >(grep -Ev '^\[INFO\]' | tail -n +5 > sqlfluff.json)

        lint_rc=${PIPESTATUS[0]}
        echo "lint_exitcode=$lint_rc" >> "$GITHUB_OUTPUT"

        # Do not fail here; let reviewdog decide
        exit 0

    - name: Report sqlfluff lint via reviewdog
      if: steps.lint.outputs.lint_exitcode != '0'
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ inputs.github-token }}
      continue-on-error: true
      shell: bash
      run: |
        cat sqlfluff.json \
          | jq -r -f "$GITHUB_ACTION_PATH/lib/sqlfluff-json-to-rdjson.jq" \
          | reviewdog \
              -f=rdjson \
              -name="sqlfluff" \
              -reporter=github-pr-review \
              -filter-mode=nofilter \
              -fail-level=info

    - name: Run sqlfluff fix
      if: inputs.run_fix == 'true'
      id: fix
      shell: bash
      env:
        FROM_REF: ${{ inputs.from-ref }}
        TO_REF: ${{ inputs.to-ref }}
      run: |
        set +e
        set -o pipefail

        pre-commit run sqlfluff-fix \
          --from-ref "$FROM_REF" \
          --to-ref   "$TO_REF"

        fix_rc=$?
        echo "fix_exitcode=$fix_rc" >> "$GITHUB_OUTPUT"

        # Capture diff for reviewdog suggestions
        git diff > sqlfluff-fix.diff || true

        # Do not fail here; let reviewdog decide
        exit 0

    - name: Report sqlfluff fix suggestions via reviewdog
      if: inputs.run_fix == 'true' && steps.fix.outputs.fix_exitcode != '0'
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ inputs.github-token }}
      continue-on-error: true
      shell: bash
      run: |
        reviewdog \
          -name="sqlfluff-fix" \
          -f=diff \
          -f.diff.strip=1 \
          -reporter=github-pr-review \
          -filter-mode=nofilter < sqlfluff-fix.diff

    - name: Fail on sqlfluff issues
      if: |
        steps.lint.outputs.lint_exitcode != '0' ||
        (inputs.run_fix == 'true' && steps.fix.outputs.fix_exitcode != '0')
      shell: bash
      run: exit 1
