name: Pre-commit Cache Warm-up

# Keeps a main-branch cache of the pre-commit hook environments for pull requests to restore: the
# pre-commit-all job in ci.yaml and the self-lint actions read it under the same key
# (pre-commit|<OS>|<resolved Python>|<hash of .pre-commit-config.yaml>), so the reusable workflow's
# python_version and pre_commit_version defaults (3.x, 4.6.2) must stay equal to theirs. The weekly
# schedule is eviction insurance.
on:
  push:
    branches:
      - main
    paths:
      - .pre-commit-config.yaml
      - .github/workflows/pre-commit-warmup.yaml
  schedule:
    - cron: "37 3 * * 1"
  workflow_dispatch:

concurrency:
  group: pre-commit-warmup-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The reusable workflow's prune job keeps only the newest two pre-commit caches of this ref, so
  # the repository cache quota is not spent on hook environments nothing uses any more. Deleting a
  # cache needs actions: write, which only the calling job can grant: without it the prune job
  # warns and skips.
  warm-pre-commit-cache:
    permissions:
      contents: read
      actions: write
    uses: leinardi/gh-reusable-workflows/.github/workflows/pre-commit-warmup.yaml@b131932e6482a7f7661a26391fdfa2297d60332a # v1.5.0
