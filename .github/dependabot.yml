version: 2

updates:
  # The repository's own workflows: nothing here ships, so a bump does not release.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # Wait a week after a release before proposing it (GitHub's default is
    # 3 days), so a broken or compromised release has time to be yanked.
    cooldown:
      default-days: 7
    labels: ["dependencies", "ci"]
    open-pull-requests-limit: 20
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  # Every action's action.yaml (each action sits in its own top-level directory). Callers run
  # these pins, so a bump is a fix(deps) that releases. The `/*` glob covers a new action too.
  - package-ecosystem: "github-actions"
    directories:
      - "/*"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    labels: ["dependencies", "ci"]
    open-pull-requests-limit: 20
    commit-message:
      prefix: "fix(deps)"
    groups:
      github-actions-shipped:
        patterns:
          - "*"

  # Keep pre-commit hook revisions up to date
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    labels: ["dependencies", "ci"]
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
