version: 2

updates:
  # Keep GitHub Actions pins up to date in the workflows and in every action's action.yaml:
  # the `/*` glob covers each top-level action directory, so a new action needs no entry here.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/*"
    schedule:
      interval: "monthly"
    # Wait a week after a release before proposing it (GitHub's default is
    # 3 days), so a broken or compromised release has time to be yanked.
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "ci"
    open-pull-requests-limit: 20
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  # Keep pre-commit hook revisions up to date
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "ci"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
