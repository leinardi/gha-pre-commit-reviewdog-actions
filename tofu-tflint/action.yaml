name: "Run OpenTofu tflint via pre-commit + reviewdog"
description: >-
  Runs the caller's tofu_tflint-json-output pre-commit hook on the files changed between two
  commits and reports its findings and fixes through reviewdog.
author: "leinardi"
branding:
  icon: "check-circle"
  color: "blue"

inputs:
  from-ref:
    description: "The base commit of the range, such as the pull request's base SHA"
    required: true
  to-ref:
    description: "The head commit of the range, such as the pull request's head SHA"
    required: true
  github-token:
    description: >-
      The token reviewdog posts with, usually secrets.GITHUB_TOKEN. Required unless reporter is
      local.
    required: false
    default: ""
  working-directory:
    description: >-
      The caller repository, relative to the workspace: a git work tree root, no absolute path, no
      `..` component. Its .pre-commit-config.yaml defines the hooks and the cache key.
    required: false
    default: "."
  reporter:
    description: "reviewdog's reporter: github-pr-review, github-check or local"
    required: false
    default: "github-pr-review"
  python-version:
    description: >-
      The Python for setup-python, such as `3.x` or `3.13`. Its resolved version is part of the
      cache key, so keep it equal to the pre-commit warm-up's `python_version`.
    required: false
    default: "3.x"
  pre-commit-version:
    description: >-
      The pre-commit release to install, X.Y.Z. Keep it equal to the version the warm-up and the
      rest of CI install.
    required: false
    default: "4.6.2"
  cache-key-prefix:
    description: >-
      The first part of the pre-commit cache key, before `|<runner.os>|`. Keep it equal to the
      warm-up's `cache_key_prefix`.
    required: false
    default: "pre-commit"
  reports-dir:
    description: >-
      For debugging and the self-tests: an absolute path to an existing, writable directory outside
      the caller repository that receives every report exactly as reviewdog gets it, plus
      reports.json. Empty: no copy is kept.
    required: false
    default: ""

outputs:
  exitcode:
    description: "pre-commit's first nonzero exit status across the passes, else 0; empty when a setup step failed"
    value: ${{ steps.run.outputs.exitcode }}
  result:
    description: >-
      passed, failed (a hook found problems), skipped (no changed files or none matched) or error
      (an operational failure, including a setup step that failed before the hooks could run)
    value: ${{ steps.run.outputs.result || 'error' }}
  ran:
    description: "true when at least one hook ran on files; false when none did or a setup step failed"
    value: ${{ steps.run.outputs.ran || 'false' }}
  findings:
    description: >-
      The number of findings posted: diagnostics plus diff hunks, across every report. Empty when a
      setup step failed before the hooks ran.
    value: ${{ steps.run.outputs.findings }}
  lint-exitcode:
    description: "pre-commit's exit status in the lint pass (tofu_tflint-json-output); empty when the pass did not run"
    value: ${{ steps.run.outputs.lint-exitcode }}

runs:
  using: "composite"
  steps:
    # Only what is missing is installed, so a hosted runner skips apt-get entirely; jq is what
    # lib/run-passes.sh and the converters run on.
    - name: Install missing system tools
      shell: bash
      env:
        TOOLS: "jq"
      run: |
        set -euo pipefail
        read -ra tools <<<"$TOOLS"
        missing=()
        for tool in "${tools[@]}"; do
          command -v "$tool" >/dev/null || missing+=("$tool")
        done
        if [[ ${#missing[@]} -gt 0 ]]; then
          if ! command -v apt-get >/dev/null; then
            echo "::error::tofu-tflint: ${missing[*]} is not on PATH and there is no apt-get to install it; install it before this action"
            exit 1
          fi
          echo "Installing ${missing[*]} with apt-get"
          sudo apt-get update
          sudo apt-get install -y "${missing[@]}"
        fi

    # The hook environments are virtualenvs bound to the interpreter that built them, so the
    # Python is set up here and its resolved version is part of the cache key, as in
    # gh-reusable-workflows' pre-commit-warmup.yaml.
    - name: Set up Python
      id: python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install pre-commit
      shell: bash
      env:
        PRE_COMMIT_VERSION: ${{ inputs.pre-commit-version }}
      run: |
        set -euo pipefail
        # A pinned release only: the value becomes a pip requirement, so anything but X.Y.Z (an
        # empty value, a range, an option) is refused rather than handed to pip.
        if ! [[ "$PRE_COMMIT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          # Escaped as workflow-command data, so the value cannot end the message early.
          got="${PRE_COMMIT_VERSION//'%'/%25}"
          got="${got//$'\r'/%0D}"
          got="${got//$'\n'/%0A}"
          echo "::error title=Invalid pre-commit-version::pre-commit-version must be X.Y.Z, got '$got'."
          exit 1
        fi
        python -m pip install --disable-pip-version-check --no-cache-dir "pre-commit==$PRE_COMMIT_VERSION"
        pre-commit --version

    # Restore only: the default branch's pre-commit warm-up is the only writer, so a pull request
    # never saves an entry. The restore key falls back to the newest entry for the same OS and
    # Python when .pre-commit-config.yaml changed; pre-commit installs only what is missing.
    - name: Restore the pre-commit cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pre-commit
        key: ${{ inputs.cache-key-prefix }}|${{ runner.os }}|${{ steps.python.outputs.python-version }}|${{ hashFiles(format('{0}/.pre-commit-config.yaml', inputs.working-directory)) }}
        restore-keys: |
          ${{ inputs.cache-key-prefix }}|${{ runner.os }}|${{ steps.python.outputs.python-version }}|

    # A pinned reviewdog, checked against its SHA-256, under RUNNER_TEMP (lib/setup-reviewdog.sh).
    - name: Set up reviewdog
      shell: bash
      run: |
        set -euo pipefail
        "$GITHUB_ACTION_PATH/../lib/setup-reviewdog.sh"

    - name: Set up OpenTofu
      uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2

    # The token is for setup-tflint's GitHub API calls only (its own default, the job token, when
    # github-token is empty); it is not exported to the hooks.
    - name: Set up TFLint
      uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      with:
        github_token: ${{ inputs.github-token || github.token }}

    # One step runs every pass: lib/run-passes.sh snapshots the worktree, runs the hooks on the
    # changed files, builds the reports, restores and verifies the worktree, then posts through
    # reviewdog. PASSES is this action's static pass list (see lib/run-passes.sh for its shape).
    - name: Run tofu-tflint
      id: run
      shell: bash
      env:
        ACTION_NAME: tofu-tflint
        PASSES: >-
          [
            {"id": "lint", "hooks": ["tofu_tflint-json-output"], "stage": "manual", "reports": [{"source": "stdout", "format": "rdjson", "name": "tofu-tflint", "converter": "tofu-tflint/rdjson.jq", "required": true}, {"source": "tree", "format": "diff", "name": "tofu-tflint (lint fixes)"}]}
          ]
        FROM_REF: ${{ inputs.from-ref }}
        TO_REF: ${{ inputs.to-ref }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        REPORTER: ${{ inputs.reporter }}
        REVIEWDOG_GITHUB_API_TOKEN: ${{ inputs.github-token }}
        REPORTS_DIR: ${{ inputs.reports-dir }}
      run: |
        set -euo pipefail
        "$GITHUB_ACTION_PATH/../lib/run-passes.sh"
